version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: rag-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  chromadb:
    image: chromadb/chroma:latest
    container_name: rag-chromadb
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
    networks:
      - rag-network
    restart: unless-stopped


  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag-backend
    ports:
      - "8001:8000"
    volumes:
      - uploads_data:/app/uploads
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/ragdb}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - VECTOR_DB_PATH=/app/data/chromadb
      - UPLOAD_DIR=/app/uploads
      - MODEL_NAME=${MODEL_NAME:-gemini-1.5-pro}
      - TEMPERATURE=${TEMPERATURE:-0.1}
      - TOP_K=${TOP_K:-5}
      - MAX_CONTEXT_TOKENS=${MAX_CONTEXT_TOKENS:-6000}
      - MAX_RESPONSE_TOKENS=${MAX_RESPONSE_TOKENS:-1000}
      - MIN_RELEVANCE_SCORE=${MIN_RELEVANCE_SCORE:-0.7}
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started
    networks:
      - rag-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 40s
      timeout: 30s
      retries: 3
      start_period: 60s
    command: uvicorn main:app --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
    driver: local
    name: rag_postgres_data
  chroma_data:
    driver: local
    name: rag_chroma_data
  uploads_data:
    driver: local
    name: rag_uploads_data

networks:
  rag-network:
    driver: bridge
    name: rag_network
